name: Daily episode

on:
  schedule:
    # GitHub delays and sometimes DROPS scheduled runs (on 2026-11-18 every 5:15-7:15 AM run was
    # dropped and the first one fired at 12:51 PM). So there is an attempt every hour from
    # 5:15 AM CDT through the evening. generate.py exits at once if today's episode exists, or
    # before 5 AM Central, so extra attempts cost ~30 s and a late episode beats a missing one.
    # Times are UTC; tests/selfcheck.py enforces the spread.
    - cron: "15 10 * * *"
    - cron: "45 10 * * *"
    - cron: "15 11 * * *"
    - cron: "45 11 * * *"
    - cron: "15 12 * * *"
    - cron: "15 13 * * *"
    - cron: "15 14 * * *"
    - cron: "15 15 * * *"
    - cron: "15 16 * * *"
    - cron: "15 18 * * *"
    - cron: "15 20 * * *"
    - cron: "15 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's episode even if it already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # Healthy run: ~1 min sources + ~1-2 min Claude + ~8 min voices. 30 leaves room for edge-tts retries.
    timeout-minutes: 30
    steps:
      - name: Start
        run: echo "START $(date -u +%FT%TZ) event=${{ github.event_name }} sha=${{ github.sha }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_URL: ${{ vars.BASE_URL }}
          LISTENER_NAME: ${{ vars.LISTENER_NAME }}
          LISTENER_CONTEXT: ${{ vars.LISTENER_CONTEXT }}
          LISTENER_STACK: ${{ vars.LISTENER_STACK }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          TARGET_MINUTES: ${{ vars.TARGET_MINUTES }}
          TLDR_TOPICS: ${{ vars.TLDR_TOPICS }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python generate.py --force
          else
            python generate.py
          fi

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "Episode $(TZ=America/Chicago date +%F)"
            git pull --rebase --quiet
            git push
            echo "PUBLISHED $(TZ=America/Chicago date +%F)"
          fi
