name: Daily episode

on:
  schedule:
    # GitHub can delay or drop scheduled runs, so there are several attempts each morning.
    # generate.py exits at once if today's episode exists, or before 5 AM Central.
    # CDT (UTC-5): 5:15, 5:45, 6:15, 6:45, 7:15.  CST (UTC-6): 4:15 and 4:45 skip, then 5:15, 5:45, 6:15.
    - cron: "15 10 * * *"
    - cron: "45 10 * * *"
    - cron: "15 11 * * *"
    - cron: "45 11 * * *"
    - cron: "15 12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's episode even if it already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # Healthy run: ~1 min sources + ~1-2 min Claude + ~8 min voices. 30 leaves room for edge-tts retries.
    timeout-minutes: 30
    steps:
      - name: Start
        run: echo "START $(date -u +%FT%TZ) event=${{ github.event_name }} sha=${{ github.sha }}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_URL: ${{ vars.BASE_URL }}
          LISTENER_NAME: ${{ vars.LISTENER_NAME }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          TARGET_MINUTES: ${{ vars.TARGET_MINUTES }}
          TLDR_TOPICS: ${{ vars.TLDR_TOPICS }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python generate.py --force
          else
            python generate.py
          fi

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "Episode $(TZ=America/Chicago date +%F)"
            git pull --rebase --quiet
            git push
            echo "PUBLISHED $(TZ=America/Chicago date +%F)"
          fi
